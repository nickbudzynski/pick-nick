<style>
/* Layout: App-Shell mit Karo-Kopfzeile (Picknickdecke), Inhalt in einer Spalte, feste Tab-Leiste unten. */
:root{
  --ink:#1E2A22;
  --muted:#66736A;
  --paper:#F5F7F2;
  --card:#FFFFFF;
  --line:#E1E7DD;
  --green:#2E6B3F;
  --green-soft:#E3EFE5;
  --red:#D7402B;
  --red-soft:#FBE7E3;
  --butter:#F6D56B;
  --display:"Fredoka", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
.num{font-variant-numeric:tabular-nums}

/* Kopf */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.gingham{height:14px;background:
  repeating-linear-gradient(90deg, rgba(215,64,43,.55) 0 10px, transparent 10px 20px),
  repeating-linear-gradient(0deg, rgba(215,64,43,.55) 0 7px, transparent 7px 14px), #fff}
.brand{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;max-width:640px;margin:0 auto}
.brand svg{flex:none}
.brand h1{font-size:26px;letter-spacing:-.01em;color:var(--green)}
.brand h1 span{color:var(--red)}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.brand .role{margin-left:auto;font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green);padding:4px 10px;border-radius:999px;white-space:nowrap}
.brand .role.nick{background:var(--red-soft);color:var(--red)}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title h2{font-size:20px}
.section-title small{color:var(--muted)}

/* Suche + Kategorien */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

/* Produkte */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;text-align:left}
.prod.in{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.prod .emo{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--paper);border-radius:14px}
.prod .nm{font-weight:800;line-height:1.2}
.prod .unit{font-size:13px;color:var(--muted)}
.prod .tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;color:var(--red);background:var(--red-soft);padding:2px 8px;border-radius:999px}
.prod .tag.free{color:var(--green);background:var(--green-soft)}
.add{margin-top:auto;border:0;background:var(--green);color:#fff;font-weight:800;border-radius:12px;padding:8px;width:100%}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--green-soft);border-radius:12px;padding:3px}
.step button{width:34px;height:34px;border:0;border-radius:10px;background:var(--card);font-size:20px;font-weight:800;color:var(--green);line-height:1}
.step b{font-size:17px}

.custom{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.custom .row{display:flex;gap:8px}
.inp{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--green);outline:0}
textarea.inp{resize:vertical;min-height:70px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.secondary{background:var(--green-soft);color:var(--green)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Korb */
.list{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .emo{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--paper);border-radius:12px;flex:none}
.li .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.li .nm{font-weight:800}
.li .unit{font-size:13px;color:var(--muted)}
.li .note{font-size:14px;padding:6px 10px;border-radius:10px}
.li .step{margin:0;flex:none}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .big{font-size:44px}

.when{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:15px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt[aria-pressed="true"] span{color:var(--green)}
.err{color:var(--red);font-weight:700;font-size:14px}

.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:17px}
.hint{font-size:14px;color:var(--muted);margin:0}

/* Untere Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
.tab{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
.tab .ic{font-size:22px;line-height:1}
.tab[aria-current="page"]{color:var(--green)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--green)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.floatcart{position:fixed;left:16px;right:16px;bottom:calc(74px + var(--safe-b));z-index:25;max-width:608px;margin:0 auto}

/* Bestellt-Bestätigung */
.sent{text-align:center;align-items:center}
.sent .bigemo{font-size:64px;line-height:1}
.sent h2{font-size:26px}
.receipt-mini{background:var(--paper);border-radius:12px;padding:12px;text-align:left;font-size:14px;width:100%}

/* Status-Pillen */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-neu{background:var(--red-soft);color:var(--red)}
.st-angenommen{background:#FFF4CF;color:#8A6400}
.st-unterwegs{background:#E3ECFB;color:#2453A6}
.st-geliefert{background:var(--green-soft);color:var(--green)}
.st-abgerechnet{background:#EFE6FA;color:#6B3FA6}
.st-bezahlt{background:#E6E9E6;color:#4A564E}

/* Auftragskarten (Nick) */
.job{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;position:relative;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.job.urgent::before{background:var(--red)}
.job.soon::before{background:var(--butter)}
.job.ok::before{background:var(--green)}
.job .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job .id{font-family:var(--display);font-weight:600;font-size:18px}
.job .meta{font-size:14px;color:var(--muted)}
.cd{font-weight:800;font-size:14px}
.cd.late{color:var(--red)}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{padding:11px 10px;font-size:15px}

.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);flex:none}
.pick .mid{flex:1;min-width:0}
.pick .nm{font-weight:800}
.pick .c{font-size:13px;color:var(--muted)}
.pick.got .nm{color:var(--green)}
.pick.miss .nm{text-decoration:line-through;color:var(--muted)}
.price{width:84px;flex:none;text-align:right;padding:8px 10px}
.mini{border:0;background:var(--paper);border-radius:8px;font-size:12px;font-weight:800;padding:6px 8px;color:var(--muted);flex:none}
.mini.on{background:var(--red-soft);color:var(--red)}

.fee{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.fee:first-child{border-top:0}
.fee label{flex:1;font-weight:700;display:flex;gap:10px;align-items:center}
.fee input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.fee.off label{color:var(--muted);font-weight:600}

.sum{display:flex;flex-direction:column;gap:4px;font-size:15px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-family:var(--display);font-size:24px;font-weight:600;border-top:2px dashed var(--line);padding-top:8px;margin-top:4px}

/* Rechnung (Mama) */
.bill{background:#fff;border-radius:6px;padding:22px 20px 26px;box-shadow:0 10px 30px rgba(30,42,34,.10);position:relative;font-size:15px;display:flex;flex-direction:column;gap:12px}
.bill::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:
  linear-gradient(-45deg, transparent 6px, #fff 0) 0 0/14px 10px repeat-x,
  linear-gradient(45deg, transparent 6px, #fff 0) 0 0/14px 10px repeat-x}
.bill .head{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bill .head h2{font-size:28px;color:var(--green)}
.bill .head h2 span{color:var(--red)}
.bill .head small{color:var(--muted)}
.bill .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px 0}
.bill .ln{display:flex;justify-content:space-between;gap:12px}
.bill .ln.miss{color:var(--muted);text-decoration:line-through}
.bill h4{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bill .tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:26px;font-weight:600;border-top:2px solid var(--ink);padding-top:10px}
.bill .thanks{text-align:center;font-size:14px;color:var(--muted)}
.stars{display:flex;justify-content:center;gap:4px}
.stars button{border:0;background:transparent;font-size:32px;filter:grayscale(1);opacity:.4;padding:2px}
.stars button.on{filter:none;opacity:1}

/* Türchen-Karte */
.cardwrap{display:flex;justify-content:center}
.doorcard{width:105mm;min-height:148mm;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(30,42,34,.12);display:flex;flex-direction:column}
.doorcard .gingham{height:22px}
.doorcard .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;flex:1}
.doorcard .door{font-family:var(--display);font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:4px 14px;font-size:14px}
.doorcard h2{font-size:34px;color:var(--green)}
.doorcard h2 span{color:var(--red)}
.doorcard p{margin:0;font-size:13.5px}
.doorcard #qr{width:120px;height:120px;display:grid;place-items:center}
.doorcard #qr svg{width:100%;height:100%}
.doorcard ol{text-align:left;margin:0;padding-left:20px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.doorcard small{color:var(--muted);font-size:11px;margin-top:auto}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:14px;max-width:90vw}
.link{color:var(--green);font-weight:800}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.copyrow{display:flex;gap:8px}
.copyrow .inp{font-size:13px}

/* Artikel-Editor (Bottom Sheet) */
.scrim{position:fixed;inset:0;background:rgba(30,42,34,.45);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:22px 22px 0 0;max-width:640px;margin:0 auto;max-height:92%;overflow-y:auto;padding:10px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet label{font-weight:800;font-size:14px;margin-top:4px}
.emorow{display:flex;gap:12px;align-items:center}
.emorow>div:last-child{flex:1;display:flex;flex-direction:column;gap:4px}
.emobig{font-size:40px;width:68px;height:68px;border-radius:18px;background:var(--paper);display:grid;place-items:center;flex:none}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;max-height:140px;overflow-y:auto;padding:6px;background:var(--paper);border-radius:12px}
.emogrid button{border:0;background:transparent;font-size:24px;height:42px;border-radius:10px}
.emogrid button.on{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green)}
.sheet .chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--green);flex:none}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.editbar{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--butter);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.editbar .btn{padding:8px 14px;flex:none}
.add.edit{background:var(--butter);color:var(--ink)}
.prod.editing{border-style:dashed}
.newitem{border:1.5px dashed var(--green);background:var(--card);color:var(--green);border-radius:var(--r);padding:14px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.newitem span{font-weight:600;font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .prod,.btn,.chip,.opt{transition:transform .12s ease, box-shadow .15s ease, background .15s ease}
  .btn:active,.add:active,.step button:active{transform:scale(.97)}
}
@media print{
  @page{size:A6;margin:0}
  body{background:#fff}
  .top,.tabbar,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .doorcard{box-shadow:none;border-radius:0;width:105mm;height:148mm}
  .gingham{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doorcard .door{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
/* ============================================================
   EINSTELLUNGEN — vor dem Hochladen ausfüllen
   Telefonnummern im internationalen Format OHNE "+" und ohne Leerzeichen,
   z. B. 4917612345678. Leer lassen = WhatsApp fragt nach dem Kontakt.
   ============================================================ */
const CONFIG = {
  nickPhone: "",      // Deine Nummer: hierhin schickt Mama die Bestellungen
  mamaPhone: "",      // Mamas Nummer: hierhin gehen Status-Updates und Rechnungen
  paypalMe:  "",      // Optional: dein PayPal.me-Name, z. B. "nickmuster"
  mamaName:  "Mama"
};

/* ---------- Katalog ---------- */
const CATS = [
  {k:"fruehstueck", l:"Frühstück"},
  {k:"kuehl", l:"Kühlregal"},
  {k:"obst", l:"Obst & Gemüse"},
  {k:"vorrat", l:"Vorrat"},
  {k:"getraenke", l:"Getränke"},
  {k:"haushalt", l:"Drogerie & Haushalt"},
  {k:"nick", l:"Extras von Nick"}
];
const P = (id,e,n,u,c,o={}) => ({id,e,n,u,c,...o});
const CATALOG = [
  P("brot","🍞","Brot","1 Laib","fruehstueck"),
  P("broetchen","🥖","Brötchen","6 Stück","fruehstueck"),
  P("croissant","🥐","Croissants","4 Stück","fruehstueck"),
  P("kaffee","☕","Kaffee","500 g","fruehstueck"),
  P("tee","🫖","Tee","1 Packung","fruehstueck"),
  P("muesli","🥣","Müsli","1 Packung","fruehstueck"),
  P("marmelade","🍓","Marmelade","1 Glas","fruehstueck"),
  P("honig","🍯","Honig","1 Glas","fruehstueck"),
  P("milch","🥛","Milch","1 Liter","kuehl"),
  P("butter","🧈","Butter","250 g","kuehl"),
  P("eier","🥚","Eier","10 Stück","kuehl"),
  P("kaese","🧀","Käse","Aufschnitt","kuehl"),
  P("wurst","🥓","Aufschnitt","1 Packung","kuehl"),
  P("joghurt","🥄","Joghurt","500 g","kuehl"),
  P("sahne","🍶","Sahne","200 ml","kuehl"),
  P("frischkaese","🧀","Frischkäse","200 g","kuehl"),
  P("aepfel","🍎","Äpfel","1 kg","obst"),
  P("bananen","🍌","Bananen","1 Bund","obst"),
  P("zitronen","🍋","Zitronen","3 Stück","obst"),
  P("tomaten","🍅","Tomaten","500 g","obst"),
  P("gurke","🥒","Gurke","1 Stück","obst"),
  P("salat","🥬","Salat","1 Kopf","obst"),
  P("moehren","🥕","Möhren","1 kg","obst"),
  P("zwiebeln","🧅","Zwiebeln","1 kg","obst"),
  P("kartoffeln","🥔","Kartoffeln","2,5 kg","obst",{h:1}),
  P("nudeln","🍝","Nudeln","500 g","vorrat"),
  P("reis","🍚","Reis","1 kg","vorrat"),
  P("dosentomaten","🥫","Dosentomaten","2 Dosen","vorrat"),
  P("oel","🫒","Olivenöl","1 Flasche","vorrat"),
  P("mehl","🌾","Mehl","1 kg","vorrat"),
  P("zucker","🍬","Zucker","1 kg","vorrat"),
  P("schoki","🍫","Schokolade","Notfallration","vorrat"),
  P("kekse","🍪","Plätzchen","1 Packung","vorrat"),
  P("wasser","💧","Wasser","1 Kasten","getraenke",{h:1}),
  P("saft","🧃","Saft","1 Liter","getraenke"),
  P("wein","🍷","Wein","1 Flasche","getraenke"),
  P("sekt","🍾","Sekt","1 Flasche","getraenke"),
  P("gluehwein","🍷","Glühwein","1 Liter","getraenke"),
  P("klopapier","🧻","Klopapier","1 Packung","haushalt",{h:1}),
  P("kuechenrolle","🧻","Küchenrolle","4 Rollen","haushalt"),
  P("spueli","🧽","Spülmittel","1 Flasche","haushalt"),
  P("tabs","🫧","Spülmaschinen-Tabs","1 Packung","haushalt"),
  P("waschmittel","🧺","Waschmittel","1 Packung","haushalt",{h:1}),
  P("muellbeutel","🗑️","Müllbeutel","1 Rolle","haushalt"),
  P("zahnpasta","🪥","Zahnpasta","1 Tube","haushalt"),
  P("duschgel","🧴","Duschgel","1 Flasche","haushalt"),
  P("teelichter","🕯️","Teelichter","Adventsvorrat","haushalt"),
  P("blumen","💐","Blumen","1 Strauß, einfach so","haushalt"),
  P("umarmung","🤗","Umarmung","extra lang","nick",{f:1}),
  P("kaffeemitnick","☕","Kaffee mit Nick","30 Minuten Quatschen","nick",{f:1}),
  P("muell","🚮","Müll rausbringen","alle Tonnen","nick",{f:1}),
  P("spuelmaschine","🍽️","Spülmaschine ausräumen","komplett","nick",{f:1}),
  P("tragen","📦","Was Schweres tragen","Keller, Dachboden, egal","nick",{f:1})
];

const EMOJIS = ["🛍️","🍞","🥖","🥐","🥯","🧀","🥚","🥛","🧈","🍳","🥓","🍗","🥩","🐟","🍤","🍝","🍚","🥫","🫒","🧂","🌶️","🍯","🍎","🍐","🍊","🍋","🍌","🍇","🍓","🫐","🥝","🍅","🥒","🥕","🥦","🥔","🧅","🧄","🥬","🍄","🥜","🍫","🍪","🍰","🍦","☕","🫖","🧃","🥤","🍷","🍺","🍾","💧","🧻","🧽","🧴","🪥","🧼","🫧","🧺","🗑️","💊","🩹","🐶","🐱","🌱","💐","🕯️","🔋","💡","📰","✉️","🎁","🤗"];

/* Eigener Katalog: neue Artikel, Änderungen und gelöschte Standard-Artikel bleiben gespeichert */
const myItems = () => LS.get("myItems", []);
const allCats = () => [...CATS, ...LS.get("myCats", [])];
function getCatalog(){
  const edits = LS.get("edits", {}), hidden = LS.get("hidden", []);
  return CATALOG.filter(p => !hidden.includes(p.id)).map(p => edits[p.id] ? {...p, ...edits[p.id]} : p).concat(myItems());
}
function saveProduct(x){
  const item = {e:x.e || "🛍️", n:x.n.trim(), u:x.u.trim(), c:x.c, h:x.h ? 1 : 0};
  const base = CATALOG.find(p => p.id === x.id);
  if (base){ const ed = LS.get("edits", {}); ed[x.id] = item; LS.set("edits", ed); return {...base, ...item}; }
  const list = myItems();
  const i = x.id ? list.findIndex(p => p.id === x.id) : -1;
  if (i >= 0){ list[i] = {...list[i], ...item}; LS.set("myItems", list); return list[i]; }
  const p = {id:"m-" + Date.now().toString(36), ...item};
  list.push(p); LS.set("myItems", list); return p;
}
function deleteProduct(id){
  if (CATALOG.some(p => p.id === id)){ const h = LS.get("hidden", []); if (!h.includes(id)) h.push(id); LS.set("hidden", h); }
  else LS.set("myItems", myItems().filter(p => p.id !== id));
}
function firstEmoji(s){
  s = (s || "").trim(); if (!s) return "";
  try { return [...new Intl.Segmenter("de", {granularity:"grapheme"}).segment(s)][0].segment; } catch(e){ return [...s][0]; }
}

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const LS = {
  get(k,d){ try{ const v = localStorage.getItem("pn_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("pn_"+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => (Math.round(n*100)/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g,"").replace("€","").replace(",",".")); return isFinite(n) ? n : 0; };
const fmtDT = ts => new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(ts)) + " Uhr";
const fmtD = ts => new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(ts));
function enc(obj){ const b = new TextEncoder().encode(JSON.stringify(obj)); let s=""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function dec(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const s = atob(str); const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return JSON.parse(new TextDecoder().decode(b)); }
const baseUrl = () => location.origin + location.pathname;
const wa = (phone, text) => "https://wa.me/" + (phone||"") + "?text=" + encodeURIComponent(text);
function openLink(url){ const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
function toast(msg){ const h = $("#toastHost"); h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=> h.innerHTML="", 2400); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Kopiert"); }catch(e){ toast("Kopieren ging nicht. Bitte markieren und kopieren."); } }
function rel(ms){
  const late = ms < 0, m = Math.round(Math.abs(ms)/6e4);
  let s;
  if (m < 60) s = m + " Min.";
  else if (m < 48*60) s = Math.round(m/60) + " Std.";
  else { const d = Math.round(m/1440); s = d + (late ? " Tagen" : " Tage"); }
  return late ? "seit " + s + " überfällig" : "noch " + s;
}

/* ---------- Zustand ---------- */
const S = {
  role: LS.get("role","mama"),
  view: null,
  cat: "alle",
  q: "",
  cart: LS.get("cart", []),
  due: LS.get("due", {k:"tmr18", custom:""}),
  note: LS.get("note",""),
  err: "",
  lastSent: null,
  orders: LS.get("orders", []),   // Nick
  openId: null,
  inv: null, stars: 0,
  editMode: false, edit: null, err2: "",
  door: LS.get("door", 7)
};
const saveCart = () => { LS.set("cart", S.cart); LS.set("due", S.due); LS.set("note", S.note); };
const saveOrders = () => LS.set("orders", S.orders);
const cartCount = () => S.cart.reduce((a,c)=>a+c.q,0);

/* ---------- Lieferzeit ---------- */
function dueOptions(){
  const now = new Date();
  const at = (d,h) => { const x = new Date(d); x.setHours(h,0,0,0); return x; };
  const tmr = new Date(now); tmr.setDate(now.getDate()+1);
  const sun = new Date(now); sun.setDate(now.getDate() + ((7 - now.getDay()) % 7 || 7));
  const opts = [{k:"asap", l:"So schnell wie möglich", s:"Notfall, z. B. kein Kaffee", d:new Date(now.getTime()+3*36e5)}];
  if (now.getHours() < 16) opts.push({k:"today18", l:"Heute bis 18 Uhr", s:"Fürs Abendessen", d:at(now,18)});
  else opts.push({k:"today21", l:"Heute bis 21 Uhr", s:"Heute noch", d:at(now,21)});
  opts.push({k:"tmr12", l:"Morgen bis 12 Uhr", s:fmtDT(at(tmr,12)), d:at(tmr,12)});
  opts.push({k:"tmr18", l:"Morgen bis 18 Uhr", s:fmtDT(at(tmr,18)), d:at(tmr,18)});
  opts.push({k:"week", l:"Diese Woche", s:"Kein Stress, bis Sonntag", d:at(sun,18)});
  opts.push({k:"custom", l:"Wunschtermin", s:"Datum und Uhrzeit wählen", d:null});
  if (now.getHours() >= 21) opts.splice(1,1);
  return opts;
}
function currentDue(){
  const opts = dueOptions();
  let o = opts.find(x => x.k === S.due.k) || opts.find(x=>x.k==="tmr18");
  if (o.k === "custom"){
    const d = S.due.custom ? new Date(S.due.custom) : null;
    return {...o, d, l: d ? "Wunschtermin" : o.l};
  }
  return o;
}

/* ---------- Routing ---------- */
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("o=")) {           // Bestellung kommt bei Nick an
    try { const o = dec(h.slice(2)); setRole("nick"); importOrder(o); S.view = "job"; }
    catch(e){ setRole("nick"); S.view = "jobs"; toast("Der Bestell-Link ist kaputt. Lass ihn dir nochmal schicken."); }
    history.replaceState(null,"",baseUrl()+"#nick");
  } else if (h.startsWith("r=")) {    // Rechnung kommt bei Mama an
    try { S.inv = dec(h.slice(2)); S.view = "bill"; S.stars = 0; }
    catch(e){ S.view = "shop"; toast("Die Rechnung konnte nicht geöffnet werden."); }
  } else if (h === "nick") { setRole("nick"); if (!["jobs","job","settings"].includes(S.view)) S.view = "jobs"; }
  else if (h === "mama") { setRole("mama"); if (!["shop","cart","orders","sent"].includes(S.view)) S.view = "shop"; }
  else if (h === "karte") { S.view = "card"; }
  else if (!S.view || S.view === "bill" || S.view === "card") S.view = S.role === "nick" ? "jobs" : "shop";
  render();
}
function setRole(r){ S.role = r; LS.set("role", r); }
function go(view){ S.view = view; render(); window.scrollTo({top:0}); }

/* ---------- Mama: Bestellung senden ---------- */
function addToCart(p, delta=1){
  const i = S.cart.findIndex(c => c.id === p.id);
  if (i < 0 && delta > 0) S.cart.push({id:p.id, e:p.e, n:p.n, u:p.u, h:p.h?1:0, f:p.f?1:0, q:delta, note:""});
  else if (i >= 0) { S.cart[i].q += delta; if (S.cart[i].q <= 0) S.cart.splice(i,1); }
  saveCart();
}
function sendOrder(){
  const d = currentDue();
  if (!S.cart.length) return;
  if (!d.d || isNaN(d.d)) { S.err = "Bitte einen Wunschtermin auswählen."; return render(); }
  if (d.d.getTime() < Date.now()) { S.err = "Der Termin liegt in der Vergangenheit. Nick ist schnell, aber nicht so schnell."; return render(); }
  S.err = "";
  const n = LS.get("counter",0) + 1; LS.set("counter", n);
  const o = { id:"PN-"+String(n).padStart(4,"0"), t:Date.now(), d:d.d.getTime(), dl:d.l, n:S.note.trim(),
              i:S.cart.map(c => ({e:c.e, n:c.n, u:c.u, q:c.q, c:(c.note||"").trim(), h:c.h, f:c.f})) };
  const lines = o.i.map(i => `${i.q}× ${i.e} ${i.n}${i.u ? " ("+i.u+")" : ""}${i.c ? "\n     ↳ „"+i.c+"“" : ""}`).join("\n");
  const text = `🧺 *Neue Pick-Nick-Bestellung* ${o.id}\n⏰ Lieferung bis: *${fmtDT(o.d)}*\n\n${lines}` +
               (o.n ? `\n\n💬 ${o.n}` : "") +
               `\n\n👉 Auftrag öffnen:\n${baseUrl()}#o=${enc(o)}`;
  const url = wa(CONFIG.nickPhone, text);
  const hist = LS.get("history", []); hist.unshift(o); LS.set("history", hist.slice(0,30));
  S.lastSent = {o, url};
  S.cart = []; S.note = ""; saveCart();
  go("sent");
  openLink(url);
}

/* ---------- Nick: Aufträge ---------- */
const uid = o => o.id + "-" + o.t;
function importOrder(o){
  if (!o || !o.id || !Array.isArray(o.i)) throw new Error("bad");
  let ex = S.orders.find(x => uid(x) === uid(o));
  if (!ex){
    ex = {...o, st:"neu", r:Date.now(), lines:o.i.map(it => ({...it, got:false, p: it.f ? "0" : "", miss:false})), ex:[]};
    S.orders.unshift(ex); saveOrders();
    toast("Neuer Auftrag " + o.id + " ist da");
  }
  S.openId = uid(ex);
}
const openOrder = () => S.orders.find(o => uid(o) === S.openId);
function totals(o){
  const goods = o.lines.filter(l=>!l.miss).reduce((a,l)=>a+num(l.p),0);
  const extra = o.ex.reduce((a,x)=>a+num(x.p),0);
  return {goods, extra, total: goods+extra};
}
const QUICK = ["🥤 Energy Drink","🍫 Schokoriegel","🥨 Brezel","🍕 Tiefkühlpizza","🍦 Eis","🥜 Chips","🥪 Snack für unterwegs"];
const STATUS = {neu:"Neu", angenommen:"Angenommen", unterwegs:"Unterwegs", geliefert:"Geliefert", abgerechnet:"Rechnung raus", bezahlt:"Bezahlt"};
function setStatus(o, st, msg){
  o.st = st; saveOrders(); render();
  if (msg) openLink(wa(CONFIG.mamaPhone, msg));
}
function sendBill(o){
  const t = totals(o);
  const inv = { id:o.id, t:Date.now(), L:o.lines.map(l => [l.q, l.n, l.miss ? null : num(l.p)]),
                X:o.ex.map(x => [x.n, num(x.p)]), s:Math.round(t.total*100)/100 };
  const text = `🧾 *Deine Pick-Nick-Rechnung* ${o.id}\nBetrag: *${eur(inv.s)}*${t.extra ? `\n(davon Liefergebühr, also meine Sachen: ${eur(t.extra)})` : `\n(Liefergebühr heute: 0 €, hab mir nichts mitgenommen 😇)`}\n\nDanke für deine Bestellung, ${CONFIG.mamaName}! 💚\n👉 Rechnung ansehen & bezahlen:\n${baseUrl()}#r=${enc(inv)}`;
  setStatus(o, "abgerechnet", text);
}

/* ---------- Render ---------- */
function render(){
  const isNick = S.role === "nick" && !["bill","card"].includes(S.view);
  const tag = $("#roleTag");
  tag.textContent = S.view === "bill" ? "Rechnung" : S.view === "card" ? "Geschenk" : isNick ? "Fahrer-App" : "Für " + CONFIG.mamaName;
  tag.className = "role" + (isNick || S.view === "card" ? " nick" : "");
  $("#tagline").textContent = isNick ? "Aufträge von " + CONFIG.mamaName : "Dein Lieferdienst mit Herz";
  const V = {shop:vShop, cart:vCart, orders:vOrders, sent:vSent, jobs:vJobs, job:vJob, settings:vSettings, bill:vBill, card:vCard};
  app.innerHTML = (V[S.view] || vShop)();
  renderTabs();
  if (S.view === "card") drawQR();
}

function renderTabs(){
  const bar = $("#tabbar");
  if (S.view === "bill" || S.view === "card"){ bar.innerHTML = ""; return; }
  let tabs;
  if (S.role === "nick"){
    const open = S.orders.filter(o => !["bezahlt"].includes(o.st)).length;
    tabs = [["jobs","🛵","Aufträge", open], ["settings","⚙️","Einstellungen",0]];
  } else {
    tabs = [["shop","🛒","Einkaufen",0], ["cart","🧺","Korb",cartCount()], ["orders","📋","Bestellungen",0]];
  }
  const cur = S.view === "job" ? "jobs" : S.view === "sent" ? "orders" : S.view;
  bar.innerHTML = `<nav style="--n:${tabs.length}" aria-label="Navigation">${tabs.map(([k,ic,l,b]) =>
    `<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':''}><span class="ic" aria-hidden="true">${ic}</span>${l}${b?`<span class="badge num">${b}</span>`:""}</button>`).join("")}</nav>`;
  let fc = "";
  if (S.role !== "nick" && S.view === "shop" && S.cart.length && !S.editMode)
    fc = `<div class="floatcart"><button class="btn big" data-go="cart">🧺 Zum Korb · ${cartCount()} ${cartCount()===1?"Artikel":"Artikel"}</button></div>`;
  bar.insertAdjacentHTML("beforeend", fc);
}

    <button class="chip" data-cat="alle" aria-pressed="${S.cat==="alle"}">Alles</button>
    ${cats.map(c => `<button class="chip" data-cat="${c.k}" aria-pressed="${S.cat===c.k}">${esc(c.l)}</button>`).join("")}
  </div>
  ${S.cat === "nick" && !ed ? `<p class="hint">Diese Extras kosten nichts. Außer vielleicht ein Lächeln.</p>` : ""}
  <div class="grid">
    ${items.map(p => {
      const c = S.cart.find(x => x.id === p.id);
      return `<div class="prod ${c && !ed ? "in" : ""} ${ed ? "editing" : ""}">
        ${p.f ? `<span class="tag free">gratis</span>` : p.h ? `<span class="tag">schwer</span>` : ""}

  renderSheet();

}
function closeEditor(){ S.edit = null; renderSheet(); }

  if (!x){ host.innerHTML = ""; document.body.style.overflow = ""; return; }

    <label class="chk"><input type="checkbox" id="eHeavy" ${x.h ? "checked" : ""}> Schwer zu tragen (z. B. Getränkekiste)</label>
    ${S.err2 ? `<p class="err" role="alert">${esc(S.err2)}</p>` : ""}
    <div class="actions" style="margin-top:6px">
      <button class="btn ghost" data-sheetclose>Abbrechen</button>
      <button class="btn" data-sheetsave>${x.id ? "Speichern" : "Speichern & in den Korb"}</button>
    </div>
    ${x.id ? `<button class="btn ghost danger" data-sheetdel>${x.sure ? "Wirklich löschen? Nochmal tippen" : builtIn ? "🗑️ Brauche ich nie, löschen" : "🗑️ Artikel löschen"}</button>` : ""}
  </div>`;
}
function saveEditor(){
  const x = S.edit;
  x.e = firstEmoji(x.e) || "🛍️";
  if (!x.n.trim()){ S.err2 = "Bitte einen Namen eingeben."; return renderSheet(); }
  if (x.c === "__new"){
    const l = x.newCat.trim();
    if (!l){ S.err2 = "Bitte einen Namen für die neue Kategorie eingeben."; return renderSheet(); }
    const mc = LS.get("myCats", []);
    let c = allCats().find(c => c.l.toLowerCase() === l.toLowerCase());
    if (!c){ c = {k:"mc-" + Date.now().toString(36), l}; mc.push(c); LS.set("myCats", mc); }
    x.c = c.k;
  }
  const isNew = !x.id;
  const p = saveProduct(x);
  S.cart.forEach(c => { if (c.id === p.id){ c.e = p.e; c.n = p.n; c.u = p.u; c.h = p.h; } });
  if (isNew){ addToCart(p, 1); S.q = ""; S.cat = p.c; toast(p.n + " ist gespeichert und im Korb"); }
  else { saveCart(); toast("Gespeichert"); }
  closeEditor(); render();
}

/* Nick: Aufträge */
function urgency(o){
  if (["geliefert","abgerechnet","bezahlt"].includes(o.st)) return "";
  const left = o.d - Date.now();
  return left < 0 ? "urgent" : left < 6*36e5 ? "urgent" : left < 24*36e5 ? "soon" : "ok";
}
function vJobs(){
  const open = S.orders.filter(o => o.st !== "bezahlt").sort((a,b)=>a.d-b.d);
  const done = S.orders.filter(o => o.st === "bezahlt");
  const card = o => {
    const t = totals(o), live = !["geliefert","abgerechnet","bezahlt"].includes(o.st), left = o.d - Date.now();
    return `<button class="job ${urgency(o)}" data-open="${esc(uid(o))}">
      <div class="row"><span class="id">${esc(o.id)}</span><span class="pill st-${o.st}">${STATUS[o.st]}</span></div>
      <div class="meta">${o.i.length} Artikel · ${o.i.slice(0,4).map(x=>esc(x.n)).join(", ")}${o.i.length>4?" …":""}</div>
      <div class="row"><span class="meta num">Bis ${fmtDT(o.d)}</span>${live ? `<span class="cd num ${left<0?"late":""}">${rel(left)}</span>` : `<span class="cd num">${eur(t.total)}</span>`}</div>
    </button>`;
  };
  return `
  <div class="section-title"><h2>Offene Aufträge</h2><small class="num">${open.length}</small></div>
  ${open.length ? open.map(card).join("") : `<div class="panel empty"><div class="big">😴</div><b>Gerade nichts zu tun.</b><span>Wenn ${esc(CONFIG.mamaName)} bestellt, kommt der Auftrag per WhatsApp. Auf den Link tippen, dann landet er hier.</span><button class="btn secondary" data-demo>Beispiel-Auftrag zum Testen</button></div>`}
  ${done.length ? `<div class="section-title"><h2>Erledigt</h2><small class="num">${eur(done.reduce((a,o)=>a+totals(o).total,0))} insgesamt</small></div>${done.map(card).join("")}` : ""}
  <div class="panel">
    <h3>Link nicht in diesem Browser geöffnet?</h3>
    <p class="hint">Bestell-Link aus WhatsApp hier einfügen:</p>
    <div class="copyrow"><input class="inp" id="paste" placeholder="https://…#o=…"><button class="btn" data-paste>Laden</button></div>
  </div>`;
}

      <div class="row"><span class="id">${esc(o.id)}</span><span class="pill st-${o.st}">${STATUS[o.st]}</span></div>
      <div class="row"><span class="meta num">Lieferung bis ${fmtDT(o.d)}</span>${!["geliefert","abgerechnet","bezahlt"].includes(o.st)?`<span class="cd num ${left<0?"late":""}">${rel(left)}</span>`:""}</div>
      <div class="meta num">Bestellt ${fmtDT(o.t)}</div>
    </div>
    ${o.n ? `<div class="receipt-mini">💬 ${esc(o.n)}</div>` : ""}
    <div class="steps" aria-label="Fortschritt">${flow.map(s => `<span class="pill ${flow.indexOf(s) <= flow.indexOf(o.st) ? "st-"+s : ""}" style="${flow.indexOf(s) > flow.indexOf(o.st) ? "background:var(--paper);color:var(--muted)" : ""}">${STATUS[s]}</span>`).join("")}</div>
    <div class="actions">
      <button class="btn secondary" data-st="angenommen" ${o.st!=="neu"?"disabled":""}>✅ Annehmen</button>
      <button class="btn secondary" data-st="unterwegs" ${["unterwegs","geliefert","abgerechnet","bezahlt"].includes(o.st)?"disabled":""}>🛵 Bin unterwegs</button>
      <button class="btn secondary" data-st="geliefert" ${["geliefert","abgerechnet","bezahlt"].includes(o.st)?"disabled":""}>📦 Geliefert</button>
      <button class="btn secondary" data-st="bezahlt" ${o.st==="bezahlt"?"disabled":""}>💸 Bezahlt</button>
    </div>
    <p class="hint">Annehmen, Unterwegs und Geliefert schicken ${esc(CONFIG.mamaName)} automatisch eine WhatsApp.</p>
  </div>

  <div class="section-title"><h2>Einkaufsliste</h2><small class="num">${gotN}/${o.lines.length} im Wagen</small></div>
  <p class="hint">Haken setzen, sobald es im Wagen liegt. Preis = Betrag für die ganze Zeile laut Kassenbon.</p>
  <div class="list">
    ${o.lines.map((l,i) => `<div class="pick ${l.got?"got":""} ${l.miss?"miss":""}">
      <input type="checkbox" data-got="${i}" ${l.got?"checked":""} aria-label="${esc(l.n)} eingepackt">
      <div class="mid"><div class="nm">${l.q}× ${l.e} ${esc(l.n)}</div><div class="c">${esc(l.u)}${l.c ? " · „"+esc(l.c)+"“" : ""}</div></div>
      <button class="mini ${l.miss?"on":""}" data-miss="${i}">${l.miss?"fehlt ✕":"fehlt?"}</button>
      <input class="inp price num" inputmode="decimal" data-price="${i}" value="${esc(l.p)}" placeholder="0,00 €" aria-label="Preis ${esc(l.n)}" ${l.miss?"disabled":""}>
    </div>`).join("")}
  </div>

  <div class="section-title"><h2>Liefergebühr 😇</h2><small class="num">${eur(t.extra)}</small></div>
  <p class="hint">Bei Pick Nick gibt es keine Gebühren. Stattdessen kommt auf die Rechnung, was du dir beim Einkaufen selbst mitgenommen hast.</p>
  <div class="chips" role="group" aria-label="Schnell hinzufügen">${QUICK.map(q => `<button class="chip" data-quick="${esc(q)}">${q}</button>`).join("")}</div>
  <div class="list">
    ${o.ex.map((x,i) => `<div class="pick"><div class="mid"><div class="nm">${esc(x.n)}</div><div class="c">für mich</div></div><button class="mini" data-exdel="${i}" aria-label="${esc(x.n)} entfernen">✕</button><input class="inp price num" inputmode="decimal" data-exprice="${i}" value="${esc(x.p)}" placeholder="0,00 €" aria-label="Preis ${esc(x.n)}"></div>`).join("")}
    <div class="pick"><div class="mid"><input class="inp" id="exName" placeholder="z. B. Energy Drink" aria-label="Was hast du dir mitgenommen?"></div><input class="inp price num" inputmode="decimal" id="exPrice" placeholder="0,00 €" aria-label="Preis"><button class="btn" style="padding:9px 12px" data-exadd aria-label="Hinzufügen">+</button></div>
  </div>

  <div class="panel">
    <div class="sum num" id="sum">${sumHTML(t)}</div>
    <button class="btn big red" data-bill>🧾 Rechnung an ${esc(CONFIG.mamaName)} schicken</button>
    ${o.st === "abgerechnet" || o.st === "bezahlt" ? `<p class="hint">Rechnung wurde schon verschickt. Nochmal tippen schickt die aktuelle Version.</p>` : ""}
  </div>
  <button class="btn ghost" data-del>Auftrag löschen</button>`;
}
const sumHTML = t => `<div><span>Einkauf für ${esc(CONFIG.mamaName)}</span><span>${eur(t.goods)}</span></div>
  <div><span>Liefergebühr (deine Sachen)</span><span>${eur(t.extra)}</span></div>
  <div class="total"><span>Gesamt</span><span>${eur(t.total)}</span></div>`;

function vSettings(){
  const ok = v => v ? `<span class="pill st-geliefert">eingetragen</span>` : `<span class="pill st-neu">fehlt</span>`;
  return `
  <div class="section-title"><h2>Einstellungen</h2></div>
  <div class="panel">
    <h3>Nummern & Bezahlen</h3>
    <div class="job" style="border:0;padding:0"><div class="row"><span>Deine Nummer</span>${ok(CONFIG.nickPhone)}</div><div class="row"><span>${esc(CONFIG.mamaName)}s Nummer</span>${ok(CONFIG.mamaPhone)}</div><div class="row"><span>PayPal.me</span>${ok(CONFIG.paypalMe)}</div></div>
    <p class="hint">Stehen ganz oben in der Datei unter CONFIG. Ohne Nummer fragt WhatsApp jedes Mal nach dem Kontakt; das funktioniert auch.</p>
  </div>
  <div class="panel">
    <h3>Links</h3>
    <p class="hint">${esc(CONFIG.mamaName)}s App:</p>
    <div class="copyrow"><input class="inp" readonly value="${esc(baseUrl())}#mama" id="l1"><button class="btn secondary" data-copy="l1">Kopieren</button></div>
    <p class="hint">Deine Fahrer-App:</p>
    <div class="copyrow"><input class="inp" readonly value="${esc(baseUrl())}#nick" id="l2"><button class="btn secondary" data-copy="l2">Kopieren</button></div>
  </div>
  <div class="panel">
    <h3>🎁 Türchen-Karte</h3>
    <p class="hint">Karte im A6-Format mit QR-Code zu ${esc(CONFIG.mamaName)}s App, zum Ausdrucken und ins Türchen stecken.</p>
    <a class="btn" href="#karte">Karte öffnen</a>
  </div>
  <div class="panel">
    <h3>Testen</h3>
    <div class="actions"><button class="btn secondary" data-demo>Beispiel-Auftrag</button><a class="btn ghost" href="#mama">Mama-Ansicht</a></div>
  </div>`;
}

/* Mama: Rechnung */
function vBill(){
  const v = S.inv;
  const L = v.L || [], X = v.X || [];
  const pp = CONFIG.paypalMe ? `https://paypal.me/${encodeURIComponent(CONFIG.paypalMe)}/${v.s.toFixed(2)}EUR` : "";
  return `
  <div class="bill num">
    <div class="head"><h2>Pick <span>Nick</span></h2><small>Lieferdienst mit Herz · Inhaber: Nick</small></div>
    <div class="meta"><span>Rechnung ${esc(v.id)}</span><span>${fmtD(v.t)}</span></div>
    <h4>Einkauf</h4>
    ${L.map(([q,n,p]) => `<div class="ln ${p==null?"miss":""}"><span>${q}× ${esc(n)}</span><span>${p==null?"nicht da":p===0?"gratis":eur(p)}</span></div>`).join("")}
    <h4>Liefergebühr</h4>
    <div class="thanks" style="text-align:left">Pick Nick nimmt keine Gebühren. Dein Fahrer hat sich nur ein paar Kleinigkeiten mitgenommen:</div>
    ${X.length ? X.map(([n,p]) => `<div class="ln"><span>${esc(n)}</span><span>${eur(p)}</span></div>`).join("") : `<div class="ln"><span>Heute nichts mitgenommen 😇</span><span>${eur(0)}</span></div>`}
    <div class="tot"><span>Gesamt</span><span>${eur(v.s)}</span></div>
    <div class="thanks">Fahrer: Nick · zahlbar bar, per PayPal oder in Umarmungen</div>
  </div>
  <div class="panel" style="margin-top:8px">
    <h3 style="text-align:center">Wie war deine Lieferung?</h3>
    <div class="stars" role="group" aria-label="Bewertung">${[1,2,3,4,5].map(n => `<button data-star="${n}" class="${n<=S.stars?"on":""}" aria-label="${n} Sterne">⭐</button>`).join("")}</div>
    ${pp ? `<a class="btn big" href="${esc(pp)}" target="_blank" rel="noopener">Mit PayPal bezahlen · ${eur(v.s)}</a>` : ""}
    <div class="actions">
      <button class="btn secondary" data-pay="bar">💶 Bar bezahlt</button>
      <button class="btn secondary" data-pay="hug">🤗 In Umarmungen</button>
    </div>
    ${pp ? `<button class="btn ghost" data-pay="pp">Mit PayPal bezahlt, Nick Bescheid geben</button>` : ""}
  </div>
  <a class="btn ghost" href="#mama">Zur App</a>`;
}
function payMsg(how){
  const v = S.inv, st = S.stars ? "\n" + "⭐".repeat(S.stars) + " für den Fahrer" : "";
  const t = { bar:`💶 Rechnung ${v.id} (${eur(v.s)}) bezahlt: bar auf die Hand.`,
              pp:`💸 Rechnung ${v.id} (${eur(v.s)}) per PayPal bezahlt.`,
              hug:`🤗 Rechnung ${v.id} (${eur(v.s)}) zahle ich in Umarmungen. Abholung jederzeit.` }[how];
  openLink(wa(CONFIG.nickPhone, t + st));
}

/* Türchen-Karte */
function vCard(){
  return `
  <div class="noprint panel">
    <h3>Türchen-Karte</h3>
    <div class="copyrow"><label for="door" class="hint" style="align-self:center;white-space:nowrap">Türchen Nr.</label><input class="inp num" id="door" type="number" min="1" max="24" value="${esc(S.door)}" style="max-width:90px"><button class="btn" data-print>Drucken</button></div>
    <a class="btn ghost" href="#nick">← Zurück zur Fahrer-App</a>
    <p class="hint">Drucken als A6 (oder A4 und ausschneiden). Der QR-Code führt zu ${esc(CONFIG.mamaName)}s App.</p>
  </div>
  <div class="cardwrap">
    <div class="doorcard">
      <div class="gingham"></div>
      <div class="in">
        <span class="door">Türchen ${esc(S.door)}</span>
        <h2>Pick <span>Nick</span></h2>
        <p><b>Dein persönlicher Lieferdienst.</b><br>Du bestellst, ich liefere. Ohne Diskussion, ohne „gleich“, versprochen.</p>
        <div id="qr" aria-label="QR-Code zur App"></div>
        <ol>
          <li>QR-Code mit der Handykamera scannen</li>
          <li>Teilen-Symbol → „Zum Home-Bildschirm“</li>
          <li>Einkaufen, Termin wählen, abschicken. Ich komme.</li>
        </ol>
        <small>Gültig unbegrenzt. Keine Liefergebühr, nur das, was ich mir unterwegs so mitnehme.</small>
      </div>
    </div>
  </div>`;
}
function drawQR(){
  const box = $("#qr"); if (!box) return;
  const url = baseUrl() + "#mama";
  const make = () => { try{ const qr = qrcode(0,"M"); qr.addData(url); qr.make(); box.innerHTML = qr.createSvgTag({cellSize:4, margin:0, scalable:true}); }catch(e){ box.innerHTML = `<small>${esc(url)}</small>`; } };
  if (window.qrcode) return make();
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
  s.onload = make; s.onerror = () => box.innerHTML = `<small style="word-break:break-all">${esc(url)}</small>`;
  document.head.appendChild(s);
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, a"); if (!b) return;
  const d = b.dataset;
  const byId = id => getCatalog().find(p => p.id === id) || S.cart.find(c => c.id === id);
  // Artikel-Editor
  if (d.sheetclose !== undefined) { closeEditor(); return; }
  if (d.emo) { S.edit.e = d.emo; renderSheet(); return; }
  if (d.sheetsave !== undefined) { saveEditor(); return; }
  if (d.sheetdel !== undefined) {
    if (!S.edit.sure){ S.edit.sure = true; renderSheet(); return; }
    const n = S.edit.n; deleteProduct(S.edit.id); closeEditor(); toast(n + " ist gelöscht"); render(); return;
  }
  if (d.editmode !== undefined) { S.editMode = !S.editMode; render(); return; }
  if (d.edit) { openEditor(getCatalog().find(p => p.id === d.edit)); return; }
  if (d.newitem !== undefined) { openEditor(null); return; }
  if (d.restore !== undefined) { const n = LS.get("hidden", []).length; LS.set("hidden", []); toast(n + " Artikel sind wieder da"); render(); return; }
  if (d.go) { if (S.view==="bill"||S.view==="card") history.replaceState(null,"",baseUrl()+"#"+S.role); go(d.go); return; }
  if (d.cat) { S.cat = d.cat; render(); return; }
  if (d.inc) { addToCart(byId(d.inc), 1); render(); return; }
  if (d.dec) { addToCart(byId(d.dec), -1); render(); return; }
  if (d.custom !== undefined) {
    const v = $("#cName").value.trim(); if (!v) return;
    addToCart({id:"c-"+Date.now(), e:"🛍️", n:v, u:"", h:0}, 1); S.q = ""; toast(v + " ist im Korb"); render(); return;
  }
  if (d.again !== undefined) {
    const o = LS.get("history", [])[+d.again]; if (!o) return;
    o.i.forEach(i => { const p = getCatalog().find(x => x.n === i.n && x.u === i.u) || {id:"c-"+i.n, e:i.e, n:i.n, u:i.u, h:i.h, f:i.f}; addToCart(p, i.q); const c = S.cart.find(x=>x.id===p.id); if (c && i.c) c.note = i.c; });
    saveCart(); toast("Alles von " + o.id + " ist im Korb"); go("cart"); return;
  }
  if (d.due) { S.due.k = d.due; S.err = ""; saveCart(); render(); return; }
  if (d.send !== undefined) { sendOrder(); return; }

  // Nick
  const o = openOrder();
  if (d.open) { S.openId = d.open; go("job"); return; }
  if (d.demo !== undefined) { setRole("nick"); demoOrder(); return; }
  if (d.paste !== undefined) {
    const v = $("#paste").value.trim(), i = v.indexOf("#o=");
    try { importOrder(dec(i >= 0 ? v.slice(i+3) : v)); go("job"); } catch(err){ toast("Das ist kein gültiger Bestell-Link."); }
    return;
  }
  if (d.copy) { copy($("#"+d.copy).value); return; }
  if (o && d.st) {
    const msgs = {
      angenommen:`✅ Pick Nick hat deine Bestellung ${o.id} angenommen!\nLieferung bis ${fmtDT(o.d)}. Dein Fahrer: Nick (⭐ 5,0).`,
      unterwegs:`🛵 Dein Fahrer ist unterwegs! Bestellung ${o.id} kommt gleich. Kaffee darf schon aufgesetzt werden.`,
      geliefert:`📦 Bestellung ${o.id} wurde geliefert. Die Rechnung kommt gleich.`
    };
    setStatus(o, d.st, msgs[d.st]); return;
  }
  if (o && d.miss) { const l = o.lines[+d.miss]; l.miss = !l.miss; if (l.miss) l.got = false; saveOrders(); render(); return; }
  if (o && d.exadd !== undefined) { const n = $("#exName").value.trim(); if (!n) return; o.ex.push({n, p:$("#exPrice").value.trim()}); saveOrders(); render(); return; }
  if (o && d.exdel) { o.ex.splice(+d.exdel,1); saveOrders(); render(); return; }
  if (d.quick) { const n = $("#exName"); if (n) { n.value = d.quick; $("#exPrice").focus(); } return; }
  if (o && d.bill !== undefined) { sendBill(o); return; }
  if (o && d.del !== undefined) { if (b.dataset.sure) { S.orders = S.orders.filter(x => x !== o); saveOrders(); go("jobs"); } else { b.dataset.sure = "1"; b.textContent = "Wirklich löschen? Nochmal tippen"; b.classList.add("red"); } return; }

  // Rechnung
  if (d.star) { S.stars = +d.star; render(); return; }
  if (d.pay) { payMsg(d.pay); toast("Danke! WhatsApp öffnet sich."); return; }
  if (d.print !== undefined) { try{ window.print(); }catch(err){ toast("Drucken geht hier nicht. Öffne die Seite im Browser."); } return; }
});

document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (S.edit && t.closest(".sheet")) {
    if (t.id === "eEmo") { S.edit.e = t.value; const pv = $("#emoPrev"); if (pv) pv.textContent = firstEmoji(t.value) || "🛍️"; document.querySelectorAll(".emogrid button").forEach(b => b.classList.toggle("on", b.dataset.emo === firstEmoji(t.value))); }
    if (t.id === "eName") S.edit.n = t.value;
    if (t.id === "eUnit") S.edit.u = t.value;
    if (t.id === "eNewCat") S.edit.newCat = t.value;
    return;
  }
  if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const n = $("#q"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} return; }
  if (d.note) { S.cart[+d.note].note = t.value; saveCart(); return; }
  if (t.id === "note") { S.note = t.value; saveCart(); return; }
  if (t.id === "dt") { S.due.custom = t.value; S.err = ""; saveCart(); return; }
  if (t.id === "door") { S.door = t.value; LS.set("door", t.value); const el = document.querySelector(".doorcard .door"); if (el) el.textContent = "Türchen " + t.value; return; }
  const o = openOrder(); if (!o) return;
  if (d.price) o.lines[+d.price].p = t.value;
  else if (d.exprice) o.ex[+d.exprice].p = t.value;
  else return;
  saveOrders(); const s = $("#sum"); if (s) s.innerHTML = sumHTML(totals(o));
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (S.edit && t.id === "eCat") { S.edit.c = t.value; renderSheet(); if (t.value === "__new") $("#eNewCat")?.focus(); return; }
  if (S.edit && t.id === "eHeavy") { S.edit.h = t.checked ? 1 : 0; return; }
  const o = openOrder(); if (!o) return;
  if (d.got) { o.lines[+d.got].got = t.checked; saveOrders(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.edit) { closeEditor(); return; }
  if (e.key !== "Enter") return;
  if (S.edit && ["eName","eUnit","eNewCat","eEmo"].includes(e.target.id)) { e.preventDefault(); saveEditor(); return; }
  if (e.target.id === "cName") document.querySelector("[data-custom]")?.click();
  if (e.target.id === "exName" || e.target.id === "exPrice") document.querySelector("[data-exadd]")?.click();
});
window.addEventListener("hashchange", route);
setInterval(() => { if (S.view === "jobs") render(); }, 60000);
route();
</script>
